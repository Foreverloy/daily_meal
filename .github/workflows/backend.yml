name: Backend
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dailymeal
          POSTGRES_PASSWORD: dailymeal
          POSTGRES_DB: dailymeal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dailymeal -d dailymeal_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://dailymeal:dailymeal@localhost:5432/dailymeal_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: make check
      - run: make test-integration
      - run: make build
