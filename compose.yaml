services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dailymeal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dailymeal}
      POSTGRES_DB: dailymeal
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dailymeal -d dailymeal"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: ./backend
    entrypoint: ["/migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: postgres://dailymeal:${POSTGRES_PASSWORD:-dailymeal}@db:5432/dailymeal?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://dailymeal:${POSTGRES_PASSWORD:-dailymeal}@db:5432/dailymeal?sslmode=disable
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Shanghai}
      HTTP_ADDR: :8080
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
